[package]
name = "folder-size-viewer"
version = "0.1.0"
description = "Folder Size Viewer desktop application"
authors = ["brunorwanda4"]
repository = "https://github.com/brunorwanda4/folder-size-viewer"
homepage = "https://github.com/brunorwanda4/folder-size-viewer"
edition = "2021"

[lib]
name = "folder_size_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
dirs = "6"
tokio = { version = "1", features = ["sync", "rt"] }
tantivy = "0.26"
jwalk = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
